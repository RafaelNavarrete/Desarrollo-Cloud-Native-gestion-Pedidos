name: CI/CD gestion-pedidos

on:
  push:
    branches:
    - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Clonar el repositorio
    - name: Clonar repositorio
      uses: actions/checkout@v3

    # Paso 2: Configurar Java 21
    - name: Configurar Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    # Paso 3: Compilar el proyecto con Maven
    - name: Compilar con Maven
      run: mvn clean package -DskipTests

    # Paso 4: Iniciar sesión en Docker Hub
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Paso 5: Construir y publicar la imagen Docker
    - name: Construir y publicar imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/gestion-pedidos:latest

    # Paso 6: Desplegar en EC2 vía SSH
    - name: Desplegar en EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gestion-pedidos:latest
          docker stop gestion-pedidos || true
          docker rm gestion-pedidos || true
          docker run -d --name gestion-pedidos \
            -v /mnt/efs:/app/efs \
            -v /home/ec2-user/wallet_gestionPedidos:/wallet_gestionPedidos \
            -p 8080:8080 \
            -e AWS_REGION=us-east-1 \
            -e AWS_S3_BUCKET=${{ secrets.S3_BUCKET_NAME }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
            -e SPRING_DATASOURCE_URL="jdbc:oracle:thin:@gestionpedidos_medium?TNS_ADMIN=/wallet_gestionPedidos" \
            -e SPRING_DATASOURCE_USERNAME=ADMIN \
            -e SPRING_DATASOURCE_PASSWORD=GestionPedidos2026! \
            ${{ secrets.DOCKERHUB_USERNAME }}/gestion-pedidos:latest
